ci:
  autoupdate_schedule: quarterly
  skip: [pip-compile]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: pip-compile
        name: pip-compile captcha/requirements.in
        args: [--directory, captcha, --universal, --torch-backend, cpu, requirements.in, -o, requirements.txt]
        files: ^captcha/requirements\.(in|txt)$
      - id: pip-compile
        name: pip-compile google-analytics/requirements.in
        args: [--directory, google-analytics, requirements.in, -o, requirements.txt]
        files: ^google-analytics/requirements\.(in|txt)$
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.15
    hooks:
      - id: biome-check
