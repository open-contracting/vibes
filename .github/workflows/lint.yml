name: Lint
on: [push, pull_request]
jobs:
  lint:
    uses: open-contracting/.github/.github/workflows/lint.yml@main
    permissions:
      contents: read
    with:
      ocds-noindent: true
      # captcha/requirements.txt pins CPU-only torch.
      pip-extra-index-url: https://download.pytorch.org/whl/cpu
